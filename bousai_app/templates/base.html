<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #334a63;
      --blue: #2d5ca6;
      --blue-deep: #234d8d;
      --success: #29984f;
      --line: #e4eaf1;
      --page: #f8f9fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: "Noto Sans JP", "BIZ UDPGothic", "Yu Gothic", sans-serif;
      line-height: 1.6;
    }

    .site-header {
      position: relative;
      z-index: 1000;
      background: var(--blue);
      color: #fff;
      box-shadow: 0 2px 10px rgb(18 47 87 / 18%);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100% - 40px, 1120px);
      min-height: 70px;
      margin: 0 auto;
    }

    .site-title {
      margin: 0;
      color: #fff;
      font-size: 1.32rem;
      font-weight: 700;
    }

    .site-menu { position: relative; }

    .menu-trigger {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      list-style: none;
    }

    .menu-trigger::-webkit-details-marker { display: none; }
    .menu-trigger:hover, .menu-trigger:focus-visible { background: rgb(255 255 255 / 14%); }

    .menu-icon,
    .menu-icon::before,
    .menu-icon::after {
      display: block;
      width: 23px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      content: "";
    }

    .menu-icon { position: relative; }
    .menu-icon::before { position: absolute; top: -7px; }
    .menu-icon::after { position: absolute; top: 7px; }

    .site-nav {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      display: grid;
      width: 248px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 12px 30px rgb(22 42 66 / 18%);
    }

    .site-nav a {
      padding: 10px 12px;
      border-radius: 5px;
      color: var(--ink);
      text-decoration: none;
    }

    .site-nav a:hover, .site-nav a:focus-visible { background: #edf3fb; }
    .nav-status { margin: 4px 12px 8px; color: #65758a; font-size: .85rem; }

    main {
      width: min(100% - 40px, 920px);
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    @media (max-width: 600px) {
      .header-inner { width: calc(100% - 28px); min-height: 62px; }
      main { width: calc(100% - 28px); padding: 20px 0 36px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">防災アプリ</h1>
      <details class="site-menu">
        <summary class="menu-trigger" aria-label="メニューを開く"><span class="menu-icon" aria-hidden="true"></span></summary>
        <nav class="site-nav" aria-label="メインメニュー">
          <a href="/">ホーム</a>
          <a href="/shelter_search">避難所検索</a>
          <a href="/shelter_register">避難所登録</a>
          <a href="/board">指示・発信ボード</a>
          {% if session.logged_in %}
            <p class="nav-status">ログイン中{% if session.username %}（{{ session.username }}）{% endif %}</p>
            <a href="/logout">ログアウト</a>
          {% else %}
            <p class="nav-status">未ログイン</p>
            <a href="/login">ログイン</a>
          {% endif %}
        </nav>
      </details>
    </div>
  </header>

  <main>
    <!-- ここに子テンプレートの content が入る -->
    {% block content %}{% endblock %}
  </main>
</body>
</html>
